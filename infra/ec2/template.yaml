AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One clean Ubuntu 24.04 development instance for the course. No SSH key and no
  inbound ports; access is through AWS Systems Manager Session Manager using the
  instance role. Minimal toolchain installed by cloud-init on first boot: uv with a managed
  Python, node LTS, AWS CLI, build tools. Git and python3 come with Ubuntu.

Parameters:
  InstanceName:
    Type: String
    Default: course-dev
    Description: Name tag and hostname prefix for the instance.
  InstanceType:
    Type: String
    Default: t4g.medium
    Description: Graviton (arm64) burstable type. t4g.small is enough for shells, t4g.medium for agent dev with node + python.
    AllowedValues: [t4g.small, t4g.medium, t4g.large, t4g.xlarge]
  RootVolumeGiB:
    Type: Number
    Default: 30
    MinValue: 16
    MaxValue: 200
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet to launch in (a default-VPC public subnet is fine; no inbound rules are opened).
  VpcId:
    Type: AWS::EC2::VPC::Id
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
    Description: Resolved at deploy time to the current Ubuntu 24.04 LTS arm64 image.
  Owner:
    Type: String
    Default: instructor
    Description: Who this instance belongs to (student id later). Used as a tag and as the
      Parameter Store prefix the instance may read, /course/<Owner>/*.
    AllowedPattern: "[a-z0-9-]+"

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${InstanceName}-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # The managed policy above lets the SSM agent work but also grants
        # ssm:GetParameter on every parameter in the account. Fence this
        # instance in to its owner's prefix so one student cannot read another
        # student's API keys. Deny always wins over the Allow above.
        - PolicyName: only-own-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Deny
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:GetParameterHistory
                NotResource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/course/${Owner}/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/course/shared/*"
                  - "arn:aws:ssm:*::parameter/aws/service/*"
      Tags:
        - { Key: Project, Value: course-infra }
        - { Key: Owner, Value: !Ref Owner }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${InstanceName}-instance-profile"
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${InstanceName}-sg"
      GroupDescription: No inbound. Outbound to the internet for package installs and API calls.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: all outbound }
      Tags:
        - { Key: Name, Value: !Sub "${InstanceName}-sg" }
        - { Key: Project, Value: course-infra }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      Monitoring: false
      EbsOptimized: true
      MetadataOptions:
        HttpTokens: required          # IMDSv2 only
        HttpPutResponseHopLimit: 2    # lets containers on the box reach IMDS
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeGiB
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: !Ref InstanceName }
        - { Key: Project, Value: course-infra }
        - { Key: Owner, Value: !Ref Owner }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # cloud-init first boot. Log: /var/log/cloud-init-output.log
          # Minimal by design: Python is managed entirely by uv (interpreter, envs, tools);
          # the system python3 stays an OS component that nothing in ~/projects touches.
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          hostnamectl set-hostname ${InstanceName}

          apt-get update
          apt-get install -y --no-install-recommends \
            unzip zip build-essential pkg-config

          # node LTS: Anthropic JS SDK, MCP servers, Claude Code
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs

          # AWS CLI v2 (arm64): reads API keys from Parameter Store with the instance role
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install && rm -rf /tmp/aws /tmp/awscliv2.zip

          # uv for the ubuntu user, with a uv-managed Python so the first project needs no download
          sudo -u ubuntu -H bash -c 'curl -LsSf https://astral.sh/uv/install.sh | sh'
          sudo -u ubuntu -H /home/ubuntu/.local/bin/uv python install 3.12
          # never fall back to the OS interpreter for projects, envs, or tools
          sudo -u ubuntu -H mkdir -p /home/ubuntu/.config/uv
          printf 'python-preference = "only-managed"\n' | sudo -u ubuntu -H tee /home/ubuntu/.config/uv/uv.toml >/dev/null

          # global npm installs (Claude Code, MCP servers) go to ~/.local without sudo
          sudo -u ubuntu -H npm config set prefix /home/ubuntu/.local

          # project layout
          sudo -u ubuntu -H mkdir -p /home/ubuntu/projects
          cat > /etc/motd <<'EOF'
          ${InstanceName}: Ubuntu 24.04 arm64. Work in ~/projects. Python via uv only (uv init / uv add / uv run / uv tool). Also: node, npm, aws, git.
          EOF

          apt-get autoremove -y && apt-get clean
          echo "user-data finished $(date -Is)" > /var/log/course-user-data.done

Outputs:
  InstanceId:
    Value: !Ref Instance
  PrivateIp:
    Value: !GetAtt Instance.PrivateIp
  Connect:
    Description: Interactive shell (needs the session-manager-plugin on your machine)
    Value: !Sub "aws ssm start-session --target ${Instance} --region ${AWS::Region} --profile course-infra"
  Ami:
    Value: !Ref AmiId
